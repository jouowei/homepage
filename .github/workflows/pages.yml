name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/notion-content-access-ll3g16]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on for the repo if it is not already,
      # so publishing needs no manual toggle in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files at the repo root — nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
